name: Build WF
on: 
  push:
    branches:
      - main
      - master'

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: Build
        run: echo "Building projet..."


  Testing:
    runs-on: ubuntu-latest
    needs: Build  
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Run Tests on main branch
        if: github.ref == 'refs/heads/main'
        run: echo "Running tests..."


